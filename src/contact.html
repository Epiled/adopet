<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensagem - Adopet</title>

    <meta property="og:title" content="Entre em contato - Adopet" />
    <meta
      property="og:description"
      content="Entre em contato com protetores e abrigos para saber mais sobre os pets disponíveis para adoção."
    />
    <meta
      property="og:image"
      content="https://github.com/Epiled/adopet/raw/master/design/github/social-preview/social-preview.png"
    />
    <meta
      property="og:url"
      content="https://adopet-plum.vercel.app/contact.html"
    />
    <meta property="og:type" content="website" />

    <meta
      name="description"
      content="Entre em contato com protetores e abrigos pelo Adopet. Tire suas dúvidas sobre os animais disponíveis, envie mensagens e agende uma visita de adoção."
    />

    <link rel="canonical" href="https://adopet-plum.vercel.app/contact.html" />

    <link rel="icon" href="./assets/favicon/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/global/style.css" />
  </head>

  <body class="container contact" data-layout="default-tablet">
    <header class="menu">
      <nav class="menu__navigation">
        <img
          class="menu__logo"
          src="./assets/svg/logos/logo.svg"
          alt="Logo - Adopet"
          width="128"
          height="31"
        />
        <ul class="menu__list">
          <li class="menu__item menu__item--house">
            <a
              class="menu__link"
              href="./index.html"
              aria-label="Página Inicial"
            ></a>
          </li>
          <li class="menu__item menu__item--email">
            <a
              class="menu__link"
              href="./contact.html"
              aria-label="Entrar em contato via e-mail"
            ></a>
          </li>
          <li class="menu__item menu__item--exit" data-auth-logout="false">
            <a
              href="index.html"
              class="menu__link menu__reset"
              aria-label="Encerrar sessão e voltar a tela de login"
              data-logout
            ></a>
          </li>
          <li class="menu__item menu__item--profile" data-auth-profile="false">
            <a
              class="menu__link"
              href="./profile.html"
              aria-label="Entrar em seu Perfil"
            >
              <img
                class="menu__profile"
                src="./assets/svg/icons-ui/user.svg"
                alt=""
                width="50"
                height="50"
                data-profile-menu-image
              />
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="container__main">
      <section class="container__content" data-layout="default-tablet">
        <h1 class="text">
          Envie uma mensagem para a pessoa ou instituição que está cuidando do
          animal:
        </h1>

        <form
          novalidate
          id="contact-form"
          class="form form--alter"
          data-contact-form
        >
          <div class="form__fields">
            <div class="form__box">
              <label class="form__label form__label--brand" for="name"
                >Nome
                <input
                  id="name"
                  class="form__input form__input--alter"
                  type="text"
                  name="name"
                  placeholder="Insira seu nome completo"
                  autocomplete="name"
                  data-field
                  data-state="default"
                  minlength="3"
                  maxlength="40"
                  required
                />
              </label>
              <span
                class="form__feedback"
                data-feedback="name"
                data-state="hidden"
              ></span>
            </div>

            <div class="form__box">
              <label class="form__label form__label--brand" for="phone"
                >Telefone
                <input
                  id="phone"
                  class="form__input form__input--alter"
                  type="tel"
                  name="phone"
                  placeholder="Insira seu telefone e/ou whatsapp"
                  autocomplete="tel"
                  data-field="phone"
                  data-state="default"
                  minlength="18"
                  maxlength="19"
                  pattern="^\+55 \(\d{2}\) (?:\d{4}-\d{4}|\d \d{4}-\d{4})$"
                  required
                />
              </label>
              <span
                class="form__feedback"
                data-feedback="phone"
                data-state="hidden"
              ></span>
            </div>

            <div class="form__box">
              <label class="form__label form__label--brand" for="animal-name"
                >Nome do animal
                <input
                  id="animal-name"
                  class="form__input form__input--alter"
                  type="text"
                  name="animalName"
                  placeholder="Por qual animal você se interessou?"
                  data-field
                  data-state="default"
                  minlength="2"
                  maxlength="40"
                  required
                />
              </label>
              <span
                class="form__feedback"
                data-feedback="animalName"
                data-state="hidden"
              ></span>
            </div>

            <div class="form__box">
              <label class="form__label form__label--brand" for="message"
                >Mensagem
                <textarea
                  id="message"
                  class="form__input form__input--alter form__input--text form__input--contact"
                  name="message"
                  placeholder="Escreva sua mensagem."
                  data-field
                  data-state="default"
                  minlength="10"
                  maxlength="300"
                  required
                ></textarea>
              </label>
              <span
                class="form__feedback"
                data-feedback="message"
                data-state="hidden"
              ></span>
            </div>

            <span
              class="form__feedback"
              data-feedback="contact"
              data-state="hidden"
            ></span>
          </div>

          <button
            class="button"
            type="submit"
            form="contact-form"
            data-button-form
            data-state="default"
          >
            Enviar
          </button>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">2022 - Desenvolvido por Alura.</p>
    </footer>

    <script type="module" src="./js/contact.js"></script>
    <script type="module" src="./js/logout.js"></script>
    <script type="module" src="./js/phone.js"></script>
  </body>
</html>
