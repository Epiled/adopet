<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - Adopet</title>

    <meta property="og:title" content="Pets para adoção - Adopet" />
    <meta
      property="og:description"
      content="Encontre cães e gatos disponíveis para adoção e conheça o próximo companheiro para sua família."
    />
    <meta
      property="og:image"
      content="https://github.com/Epiled/adopet/raw/master/design/github/social-preview/social-preview.png"
    />
    <meta
      property="og:url"
      content="https://adopet-plum.vercel.app/home.html"
    />
    <meta property="og:type" content="website" />

    <meta
      name="description"
      content="Explore nossa lista de cães e gatos disponíveis para adoção. Conheça as histórias de cada pet e encontre o companheiro ideal para o seu lar no Adopet."
    />

    <link rel="icon" href="./assets/favicon/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/global/style.css" />
  </head>

  <body class="container home" data-layout="default-desktop">
    <header class="menu">
      <nav class="menu__navigation">
        <img
          class="menu__logo"
          src="./assets/svg/logos/logo.svg"
          alt="Logo - Adopet"
          width="128"
          height="31"
        />
        <ul class="menu__list">
          <li class="menu__item menu__item--house">
            <a
              class="menu__link"
              href="./index.html"
              aria-label="Página Inicial"
            ></a>
          </li>
          <li class="menu__item menu__item--email">
            <a
              class="menu__link"
              href="./contact.html"
              aria-label="Entrar em contato via e-mail"
            ></a>
          </li>
          <li class="menu__item menu__item--profile">
            <a
              class="menu__link"
              href="./profile.html"
              aria-label="Entrar em seu Perfil"
            ></a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="container__main">
      <section class="container__content home__content">
        <h1 class="text">Olá! Veja os amigos disponíveis para adoção!</h1>

        <span class="text" data-pets-status aria-live="polite"></span>

        <ul class="pets" data-list-pets></ul>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">2022 - Desenvolvido por Alura.</p>
    </footer>

    <script type="module" src="./js/list.js"></script>
  </body>
</html>
