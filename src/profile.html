<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Perfil - Adopet</title>

    <meta
      name="description"
      content="Gerencie suas informações pessoais, atualize sua foto e acompanhe seu histórico e preferências de adoção dentro da comunidade Adopet."
    />

    <link rel="icon" href="./assets/favicon/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/global/style.css" />
  </head>

  <body class="container profile" data-layout="default-tablet">
    <header class="menu">
      <nav class="menu__navigation">
        <img
          class="menu__logo"
          src="./assets/svg/logos/logo.svg"
          alt="Logo - Adopet"
          width="128"
          height="31"
        />
        <ul class="menu__list">
          <li class="menu__item menu__item--house">
            <a
              class="menu__link"
              href="./index.html"
              aria-label="Página Inicial"
            ></a>
          </li>
          <li class="menu__item menu__item--email">
            <a
              class="menu__link"
              href="./contact.html"
              aria-label="Entrar em contato via e-mail"
            ></a>
          </li>
          <li class="menu__item menu__item--exit">
            <a
              href="index.html"
              class="menu__link menu__reset"
              aria-label="Encerrar sessão e voltar a tela de login"
              data-logout
            ></a>
          </li>
          <li class="menu__item menu__item--profile">
            <a
              class="menu__link"
              href="./profile.html"
              aria-label="Entrar em seu Perfil"
            ></a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="container__main">
      <section class="container__content" data-layout="default-tablet">
        <h1 class="text">
          Esse é o perfil que aparece para responsáveis ou ONGs que recebem sua
          mensagem.
        </h1>

        <form
          novalidate
          id="profile-form"
          class="form form--alter"
          data-profile-form
        >
          <div class="form__fields">
            <h2 class="form__title">Perfil</h2>

            <div class="form__box">
              <label class="form__label form__label--brand" for="photo"
                >Foto
                <div class="form__box form__box--alter">
                  <img
                    class="form__photo"
                    src="./assets/svg/icons-ui/user.svg"
                    alt=""
                  />
                  <button type="button" class="form__link form__link--alter">
                    Clique na foto para editar
                  </button>
                </div>
                <input
                  id="photo"
                  class="form__input form__input--alter sr-only"
                  type="file"
                  name="photo"
                  data-field
                  data-state="default"
                  placeholder="Envie sua foto"
                />
              </label>
              <span
                class="form__feedback"
                data-feedback="photo"
                data-state="hidden"
              ></span>
            </div>

            <div class="form__box">
              <label class="form__label form__label--brand" for="name"
                >Nome
                <input
                  id="name"
                  class="form__input form__input--alter"
                  type="text"
                  name="name"
                  placeholder="Insira seu nome completo"
                  autocomplete="name"
                  data-field
                  data-state="default"
                  minlength="3"
                  maxlength="40"
                  required
                />
              </label>
              <span
                class="form__feedback"
                data-feedback="name"
                data-state="hidden"
              ></span>
            </div>

            <div class="form__box">
              <label class="form__label form__label--brand" for="phone"
                >Telefone
                <input
                  id="phone"
                  class="form__input form__input--alter"
                  type="tel"
                  name="phone"
                  placeholder="Insira seu telefone e/ou whatsapp"
                  autocomplete="tel"
                  data-field
                  data-state="default"
                  minlength="10"
                  maxlength="12"
                />
              </label>
              <span
                class="form__feedback"
                data-feedback="phone"
                data-state="hidden"
              ></span>
            </div>

            <div class="form__box">
              <label class="form__label form__label--brand" for="city"
                >Cidade
                <input
                  id="city"
                  class="form__input form__input--alter"
                  type="text"
                  name="city"
                  placeholder="Insira sua cidade"
                  autocomplete="address-level2"
                  data-field
                  data-state="default"
                  minlength="3"
                  maxlength="20"
                />
              </label>
              <span
                class="form__feedback"
                data-feedback="city"
                data-state="hidden"
              ></span>
            </div>

            <div class="form__box">
              <label class="form__label form__label--brand" for="about"
                >Sobre
                <textarea
                  id="about"
                  class="form__input form__input--alter form__input--text form__input--profile"
                  name="about"
                  placeholder="Escreva um pouco sobre você."
                  data-field
                  data-state="default"
                  minlength="10"
                  maxlength="250"
                ></textarea>
              </label>
              <span
                class="form__feedback"
                data-feedback="about"
                data-state="hidden"
              ></span>
            </div>

            <span
              class="form__feedback"
              data-feedback="profile"
              data-state="hidden"
            ></span>

            <button
              class="button"
              type="submit"
              form="profile-form"
              data-button-form
              data-state="default"
            >
              Salvar
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">2022 - Desenvolvido por Alura.</p>
    </footer>

    <script type="module" src="./js/database.js"></script>
    <script type="module" src="./js/profile.js"></script>
    <script type="module" src="./js/logout.js"></script>
  </body>
</html>
