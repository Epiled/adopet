<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Cadastro - Adopet</title>

    <meta
      name="description"
      content="Crie sua conta gratuita no Adopet hoje mesmo. Junte-se à nossa rede de proteção animal e dê o primeiro passo para levar um novo pet para casa."
    />

    <link
      rel="icon"
      href="./assets/favicon/favicon-blue.svg"
      type="image/svg+xml"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/global/style.css" />
  </head>

  <body class="container" data-layout="default">
    <header class="menu">
      <nav class="menu__navigation">
        <img
          class="menu__logo"
          src="./assets/svg/logos/logo.svg"
          alt="Logo - Adopet"
          width="128"
          height="31"
        />
        <ul class="menu__list">
          <li class="menu__item menu__item--house">
            <a
              class="menu__link"
              href="./index.html"
              aria-label="Página Inicial"
            ></a>
          </li>
          <li class="menu__item menu__item--email">
            <a
              class="menu__link"
              href="./contact.html"
              aria-label="Entrar em contato via e-mail"
            ></a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="container__main">
      <section class="container__content register__content">
        <img
          class="logo"
          src="./assets/svg/logos/logo-blue.svg"
          alt="Adopet"
          width="260"
          height="64"
        />

        <div class="register__texts">
          <h1 class="text">Ainda não tem register?</h1>
          <p class="text">
            Então, antes de buscar seu melhor amigo, precisamos de alguns dados:
          </p>
        </div>

        <form novalidate id="register-form" data-register-form class="form">
          <div class="form__box">
            <label class="form__label" for="email"
              >Email
              <input
                id="email"
                class="form__input"
                type="email"
                name="email"
                placeholder="Escolha seu melhor email"
                autocomplete="email"
                data-field
                data-state="default"
                required
              />
            </label>
            <span
              class="form__feedback"
              data-feedback="email"
              data-state="hidden"
            ></span>
          </div>

          <div class="form__box">
            <label class="form__label" for="name"
              >Nome
              <input
                id="name"
                class="form__input"
                type="text"
                name="name"
                placeholder="Digite seu nome completo"
                autocomplete="name"
                data-field
                data-state="default"
                required
              />
            </label>
            <span
              class="form__feedback"
              data-feedback="name"
              data-state="hidden"
            ></span>
          </div>

          <div class="form__box">
            <label class="form__label" for="password"
              >Senha
              <input
                id="password"
                class="form__input form__password"
                type="password"
                name="password"
                placeholder="Crie uma senha"
                autocomplete="new-password"
                data-field
                data-state="default"
                required
              />
            </label>
            <span
              class="form__feedback"
              data-feedback="password"
              data-state="hidden"
            ></span>
          </div>

          <div class="form__box">
            <label class="form__label" for="confirmPassword"
              >Confirma sua senha
              <input
                id="confirmPassword"
                class="form__input form__password"
                type="password"
                name="confirmPassword"
                placeholder="Repita a senha criada acima"
                autocomplete="new-password"
                data-field
                data-state="default"
                required
              />
            </label>
            <span
              class="form__feedback"
              data-feedback="confirmPassword"
              data-state="hidden"
            ></span>
          </div>

          <span
            class="form__feedback"
            data-feedback="register"
            data-state="hidden"
          ></span>
        </form>

        <button
          class="button"
          type="submit"
          form="register-form"
          data-button-form
          data-state="default"
        >
          Cadastrar
        </button>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">2022 - Desenvolvido por Alura.</p>
    </footer>

    <script type="module" src="./js/register.js"></script>
  </body>
</html>
